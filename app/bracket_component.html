    } else if (live) {
      cls.push("pickable");
      o.attrs = `data-pick="${r},${j}" data-team="${esc(t)}"`;
    }
    if (pk === t) cls.push("picked");
    if (done) cls.push(done === t ? "won" : "lost");
    if (done && pk === t) o.mark = done === t ? "ok" : "no";
    o.cls = cls; o.seed = t ? seedOf(t) : ""; o.p = p; o.host = t && t === host;
    return row(t, o);
  };
  const ia = r === 1 ? 2 * j : null;
  return `<div class="match${live ? " current" : ""}">${one(a, pa, ia)}${one(b, pa == null ? null : 1 - pa, ia == null ? null : ia + 1)}</div>`;
}

function regionView(g) {
  let html = `<div class="bracket">`;
  for (let r = 1; r <= 4; r++) {
    const per = 16 >> r;
    html += `<div class="col"><h4>${RN[r]}</h4><div class="cb">`;
    for (let j = g * per; j < (g + 1) * per; j++) html += matchBox(r, j);
    html += `</div></div>`;
  }
  return html + `</div>`;
}

function finalFourView() {
  let html = `<div class="bracket ff"><div class="col"><h4>${RN[5]}</h4><div class="cb">${matchBox(5, 0)}${matchBox(5, 1)}</div></div>
              <div class="col"><h4>${RN[6]}</h4><div class="cb">${matchBox(6, 0)}</div></div><div class="col"><h4>Champion</h4><div class="cb">`;
  const c = S.results[6] ? S.results[6][0] : null;
  html += `<div class="match">${row(c, {seed: c ? seedOf(c) : "", tbd: "TBD", cls: c ? ["won"] : []})}</div></div></div></div>`;
  return html;
}

function oddsView() {
  OD ||= odds();
  const heads = ["2nd rd", "Reg. semi", "Reg. final", "Final Four", "Final", "Champion"];
  const rows = S.slots.slice().sort((x, y) => OD[y][7] - OD[x][7] || OD[y][5] - OD[x][5]);
  const n = 4000;
  let html = `<p class="help">Each team's chance of reaching each round, from 4,000 simulations of whatever is still unplayed. Rounds already simulated count as settled.</p>
    <div class="oddswrap"><table class="odds"><thead><tr><th>Seed</th><th>Team</th><th>Conf</th>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>`;
  for (const t of rows) {
    const i = S.slots.indexOf(t), reg = Math.floor(i / 16) + 1, sd = SEEDS[i % 16];
    html += `<tr><td>R${reg}${sd ? "·" + sd : ""}</td><td><span class="sw" style="display:inline-block;background:${D.teams[t].color}"></span> ${esc(t)}</td><td>${esc(D.teams[t].conf)}</td>`;
    for (let k = 2; k <= 7; k++) {
      const v = OD[t][k] / n;
      html += `<td>${v >= 1 ? "100%" : v <= 0 ? "&ndash;" : pct(v)}</td>`;
    }
    html += `</tr>`;
  }
  return html + `</tbody></table></div>`;
}

function poolPanel() {
  const f = S.filter.toLowerCase();
  const list = S.pool.filter(t => !f || t.toLowerCase().includes(f) ||
                                   D.teams[t].conf.toLowerCase().includes(f));
  let html = `<div class="pool" data-pooldrop="1"><h4>Not in the field (${S.pool.length})</h4>
    <input id="flt" placeholder="Filter by team or conference" value="${esc(S.filter)}">
    <div class="list">`;
  for (const t of list.slice(0, 120)) {
    const T = D.teams[t];
    const sel = S.sel && S.sel.kind === "pool" && S.sel.t === t ? " sel" : "";
    html += `<div class="row drag${sel}" draggable="true" data-pool="${esc(t)}">
      <span class="sw" style="background:${T.color}"></span><span class="name">${esc(t)}</span>
      <span class="meta">${D.metric(T)} · ${T.rec}</span></div>`;
  }
  if (list.length > 120) html += `<p class="help">${list.length - 120} more; filter to find them.</p>`;
  return html + `</div></div>`;
}

function draw() {
  const sc = scoreboard();
  const r = S.round;
  const regionName = g => S.slots[g * 16];
  const picksIn = (rr, g) => {
    if (rr > 4) return "";
    const per = 16 >> rr; let k = 0;
    for (let j = g * per; j < (g + 1) * per; j++) if ((S.picks[rr] || {})[j]) k++;
    return `<span class="n">${k}/${per}</span>`;
  };
  let bar, help;
  if (r === 0) {
    bar = `<span class="stage">Set the field</span>
      <button class="primary" id="lock">Lock the field and start picking</button>
      <button id="auto" title="Picks the favorite in every match and simulates the whole tournament">Auto-generate the bracket</button>
      <button id="reset">Reset to projection</button>`;
    help = `Drag a team onto another slot to swap them, or drag one in from the list on the right to replace a team in the field. On a touch screen, tap one team and then another. Seeds belong to the slot, so a team takes the seed of the slot it lands in.`;
  } else if (r <= 6) {
    const done = Object.keys(S.picks[r] || {}).length;
    bar = `<span class="stage">${RN[r]}</span>
      <span class="help" style="margin:0">${done} of ${nM(r)} picked</span>
      <button id="fav">Fill in the favorites</button>
      <button class="primary" id="sim">Simulate the ${RN[r].toLowerCase()}</button>
      <button id="reroll" ${r > 1 ? "" : "disabled"}>Re-roll the ${r > 1 ? RN[r - 1].toLowerCase() : "last round"}</button>
      <button id="auto" title="Picks the favorite in every match you have not picked and simulates every remaining round">Auto-generate the rest</button>
      <button id="pdf">Download PDF</button>
      <button id="reset">Start over</button>`;
    help = `Click a team in each highlighted match to pick it. The percentages are the predictor's win chances, with the home edge for campus hosts in the first two rounds. Unpicked matches score nothing. Fill in the favorites picks the likelier team in every match you have not picked yourself.`;
  } else {
    bar = `<span class="stage">Tournament complete</span>
      <button class="primary" id="pdf">Download PDF</button>
      <button id="reroll">Re-roll the final</button><button id="reset">Start over</button>`;
    help = "";
  }
  const tabs = [0, 1, 2, 3].map(g => `<button data-view="${g}" class="${S.view === g ? "on" : ""}">${esc(regionName(g))} region${r >= 1 && r <= 4 ? picksIn(r, g) : ""}</button>`)
    .concat([`<button data-view="4" class="${S.view === 4 ? "on" : ""}">Final Four</button>`,
             `<button data-view="5" class="${S.view === 5 ? "on" : ""}">Odds</button>`]).join("");
  let body;
  if (S.view <= 3) body = `<div class="wrap">${regionView(S.view)}${r === 0 ? poolPanel() : ""}</div>`;
  else if (S.view === 4) body = finalFourView();
  else body = oddsView();
  const champ = S.results[6] ? `<div class="champ">Champion: ${esc(S.results[6][0])}</div>` : "";
  document.getElementById("app").innerHTML = `
    <div class="bar">${bar}</div>${help ? `<p class="help">${help}</p>` : ""}
    <div class="score"><span>Your score <b>${sc.pts}</b> of ${sc.possible} possible so far</span>
      ${sc.parts.map(p => `<span>${p}</span>`).join("")}
      <span>Points per correct pick: 1, 2, 4, 8, 16, 32</span></div>
    ${champ}<div class="tabs">${tabs}</div>${body}`;
  wire();
}

function wire() {
  const $ = id => document.getElementById(id);
  $("lock") && ($("lock").onclick = lockField);
  $("reset") && ($("reset").onclick = reset);
  $("fav") && ($("fav").onclick = pickFavorites);
  $("sim") && ($("sim").onclick = simulate);
  $("reroll") && ($("reroll").onclick = reroll);
  $("auto") && ($("auto").onclick = autoplay);
  $("pdf") && ($("pdf").onclick = () => {
    try { makePDF(); } catch (e) { alert("Could not build the PDF: " + e.message); }
  });
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { S.view = +b.dataset.view; draw(); });
  document.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => {
    const [r, j] = el.dataset.pick.split(",").map(Number); pick(r, j, el.dataset.team);
  });
  const flt = $("flt");
  if (flt) flt.oninput = e => {
    S.filter = e.target.value; const pos = e.target.selectionStart; draw();
    const f = $("flt"); f.focus(); f.setSelectionRange(pos, pos);
  };
  // drag and drop, plus tap-to-swap for touch screens
  const src = el => el.dataset.slot != null ? {kind: "slot", i: +el.dataset.slot}
                                             : {kind: "pool", t: el.dataset.pool};
  document.querySelectorAll("[draggable=true]").forEach(el => {
    el.ondragstart = e => { e.dataTransfer.setData("text/plain", JSON.stringify(src(el))); };
    el.onclick = () => tap(src(el));
  });
  document.querySelectorAll("[data-slot]").forEach(el => {
    el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = e => { e.preventDefault(); move(JSON.parse(e.dataTransfer.getData("text/plain")), src(el)); };
  });
  document.querySelectorAll("[data-pool]").forEach(el => {
    el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = e => { e.preventDefault(); move(JSON.parse(e.dataTransfer.getData("text/plain")), src(el)); };
  });
}

D.metric = T => D.basis === "committee"
  ? (T.rpi_rank ? `RPI #${T.rpi_rank}` : "RPI n/a") : `Rating #${T.comp_rank}`;
fresh(); draw();
</script>
